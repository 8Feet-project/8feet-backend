[project]
name = "8feet-backend"
version = "1.0.0"
description = "8Feet 商业对象智能深度调研分析平台后端服务"
readme = "README.md"
authors = [
    { name = "oNya", email = "oNya685@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "efeet",
    "Django",
    "psycopg2-binary",
    "pillow",
    "requests",
    "pandas",
    "PyJWT",
    "django-redis",
    "PyYAML",
    "minio",
    "django-cors-headers",
    "langchain-core",
    "python-dotenv",
    "channels",
    "channels-redis",
    "daphne",
    "celery[redis]",
    "python-docx",
    "reportlab",
]

[dependency-groups]
dev = [
    "pylint",
    "pylint-django",
]

[tool.uv.sources]
efeet = { path = "efeet" }
