name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "ref/**"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SETTINGS_MODULE: eightfeet.settings
  DJANGO_DEBUG: "true"
  DJANGO_SECRET_KEY: ci-only-secret-key
  DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
  DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1,http://localhost
  LOG_DIR: /tmp/8feet-logs
  DB_HOST: 127.0.0.1
  DB_PORT: "5432"
  DB_USER: ci
  DB_PASSWORD: ci
  DB_NAME: eightfeet_ci
  REDIS_ADDRESS: 127.0.0.1:6379
  REDIS_DATABASE: "0"
  CELERY_BROKER_URL: redis://127.0.0.1:6379/0
  CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
  CHANNEL_REDIS_ADDRESS: 127.0.0.1:6379
  S3_SECRET_ID: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_ADDRESS: 127.0.0.1:9000
  S3_BUCKET_REPORTS: eightfeet-reports
  S3_USE_SSL: "false"
  STATIC_ROOT: /tmp/8feet-static

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.9-alpine3.23
        env:
          POSTGRES_DB: eightfeet_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d eightfeet_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.8-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv sync

      - name: Run Django system checks
        run: uv run python src/manage.py check

      - name: Run Django tests
        run: uv run python src/manage.py test research.tests llm_manager.tests -v 2

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: 8feet-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
