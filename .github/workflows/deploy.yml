name: Backend CD

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main
      environment:
        description: Target GitHub environment
        required: true
        default: production
        type: choice
        options:
          - staging
          - production
      publish_image:
        description: Build and push image to GHCR before deploy
        required: true
        default: false
        type: boolean
      deploy_ssh:
        description: Deploy on the configured SSH host
        required: true
        default: true
        type: boolean

concurrency:
  group: backend-cd-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/8feet-project/8feet-backend

jobs:
  deploy:
    name: Build and deploy backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Check out efeet submodule
        env:
          EFEET_REPO_TOKEN: ${{ secrets.EFEET_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${EFEET_REPO_TOKEN}"
          git config --global url."https://x-access-token:${EFEET_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync -- efeet
          git submodule update --init --force --depth=1 efeet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image version
        id: version
        run: echo "sha_short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_image == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_image == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.sha_short }}
            ${{ env.IMAGE_NAME }}:${{ github.event.inputs.environment || 'production' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve deploy image
        id: deploy_image
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.publish_image }}" = "true" ]; then
            echo "ref=${IMAGE_NAME}:${{ steps.version.outputs.sha_short }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${IMAGE_NAME}:${{ github.event.inputs.environment || 'production' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: ${{ github.event_name == 'workflow_run' || github.event.inputs.deploy_ssh == 'true' }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_SSH_KEY}"
          test -n "${DEPLOY_SSH_HOST}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/8feet_deploy_key
          chmod 600 ~/.ssh/8feet_deploy_key
          ssh-keyscan -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        if: ${{ github.event_name == 'workflow_run' || github.event.inputs.deploy_ssh == 'true' }}
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          DEPLOY_REF: ${{ github.event.inputs.ref || 'main' }}
          DEPLOY_IMAGE: ${{ steps.deploy_image.outputs.ref }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_SSH_HOST}"
          test -n "${DEPLOY_SSH_USER}"
          test -n "${DEPLOY_APP_DIR}"
          test -n "${DEPLOY_IMAGE}"
          test -n "${GHCR_USERNAME}"
          test -n "${GHCR_TOKEN}"
          ssh -i ~/.ssh/8feet_deploy_key \
            -p "${DEPLOY_SSH_PORT:-22}" \
            "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}" \
            "DEPLOY_APP_DIR='${DEPLOY_APP_DIR}' DEPLOY_REF='${DEPLOY_REF}' DEPLOY_IMAGE='${DEPLOY_IMAGE}' GHCR_USERNAME='${GHCR_USERNAME}' GHCR_TOKEN='${GHCR_TOKEN}' bash -s" <<'REMOTE_DEPLOY'
          set -euo pipefail
          compose_project="${DEPLOY_COMPOSE_PROJECT:-$(basename "${DEPLOY_APP_DIR}")}"
          worktree_dir="$(mktemp -d /tmp/8feet-backend-deploy.XXXXXX)"
          rmdir "${worktree_dir}"
          target_ref="${DEPLOY_REF}"
          deploy_image="${DEPLOY_IMAGE}"
          compose_file="${worktree_dir}/docker-compose.yml"
          compose_args=( -p "${compose_project}" --project-directory "${DEPLOY_APP_DIR}" -f "${compose_file}" )
          env_file_args=()

          cleanup() {
            docker logout ghcr.io >/dev/null 2>&1 || true
            cd /
            git -C "${DEPLOY_APP_DIR}" worktree remove --force "${worktree_dir}" 2>/dev/null || rm -rf "${worktree_dir}"
          }
          trap cleanup EXIT

          echo "[deploy] source directory: ${DEPLOY_APP_DIR}"
          cd "${DEPLOY_APP_DIR}"
          if [ -n "$(git status --short)" ]; then
            echo "[deploy] existing local changes in deploy checkout:"
            git status --short
          fi

          echo "[deploy] fetching source"
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/remotes/origin/${DEPLOY_REF}"; then
            target_ref="origin/${DEPLOY_REF}"
          elif git rev-parse --verify --quiet "${DEPLOY_REF}^{commit}" >/dev/null; then
            target_ref="${DEPLOY_REF}"
          else
            echo "[deploy] ref not found: ${DEPLOY_REF}" >&2
            exit 1
          fi

          echo "[deploy] preparing clean worktree for ${target_ref}"
          git worktree add --force --detach "${worktree_dir}" "${target_ref}"

          if [ -f "${DEPLOY_APP_DIR}/.env" ]; then
            env_file_args=(--env-file "${DEPLOY_APP_DIR}/.env")
            set -a
            # shellcheck disable=SC1090
            . "${DEPLOY_APP_DIR}/.env"
            set +a
          fi

          cd "${worktree_dir}"

          echo "[deploy] logging into ghcr.io"
          printf '%s\n' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

          echo "[deploy] stopping legacy host service if present"
          if command -v systemctl >/dev/null 2>&1; then
            sudo systemctl stop 8feet.service 2>/dev/null || true
            sudo systemctl stop 8feet-backend.service 2>/dev/null || true
          fi

          echo "[deploy] removing stale compose backup containers"
          stale_containers="$(docker ps -a --format '{{.Names}}' | grep -E "^[0-9a-f]{12}_${compose_project}-" || true)"
          if [ -n "${stale_containers}" ]; then
            echo "${stale_containers}" | xargs -r docker rm -f
          fi

          echo "[deploy] pulling backend image ${deploy_image}"
          BACKEND_IMAGE="${deploy_image}" docker compose "${compose_args[@]}" "${env_file_args[@]}" pull backend celery-worker

          echo "[deploy] updating application services"
          BACKEND_IMAGE="${deploy_image}" docker compose "${compose_args[@]}" "${env_file_args[@]}" up -d --no-deps --remove-orphans backend celery-worker
          BACKEND_IMAGE="${deploy_image}" docker compose "${compose_args[@]}" "${env_file_args[@]}" ps

          echo "[deploy] waiting for readyz"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz; then
              echo
              echo "[deploy] readyz ok"
              exit 0
            fi
            sleep 5
          done

          echo "[deploy] backend did not become ready; recent logs:"
          BACKEND_IMAGE="${deploy_image}" docker compose "${compose_args[@]}" "${env_file_args[@]}" logs --tail=200 backend celery-worker
          exit 1
          REMOTE_DEPLOY
