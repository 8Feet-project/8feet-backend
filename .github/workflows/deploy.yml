name: Backend CD

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main
      environment:
        description: Target GitHub environment
        required: true
        default: production
        type: choice
        options:
          - staging
          - production
      publish_image:
        description: Build and push image to GHCR
        required: true
        default: true
        type: boolean
      deploy_ssh:
        description: Deploy on the configured SSH host
        required: true
        default: true
        type: boolean

concurrency:
  group: backend-cd-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/8feet-project/8feet-backend

jobs:
  deploy:
    name: Build and deploy backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image version
        id: version
        run: echo "sha_short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_image == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_image == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.sha_short }}
            ${{ env.IMAGE_NAME }}:${{ github.event.inputs.environment || 'production' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        if: ${{ github.event_name == 'workflow_run' || github.event.inputs.deploy_ssh == 'true' }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_SSH_KEY}"
          test -n "${DEPLOY_SSH_HOST}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/8feet_deploy_key
          chmod 600 ~/.ssh/8feet_deploy_key
          ssh-keyscan -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        if: ${{ github.event_name == 'workflow_run' || github.event.inputs.deploy_ssh == 'true' }}
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          DEPLOY_REF: ${{ github.event.inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_SSH_HOST}"
          test -n "${DEPLOY_SSH_USER}"
          test -n "${DEPLOY_APP_DIR}"
          ssh -i ~/.ssh/8feet_deploy_key \
            -p "${DEPLOY_SSH_PORT:-22}" \
            "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}" \
            "DEPLOY_APP_DIR='${DEPLOY_APP_DIR}' DEPLOY_REF='${DEPLOY_REF}' bash -s" <<'REMOTE_DEPLOY'
          set -euo pipefail
          compose_project="${DEPLOY_COMPOSE_PROJECT:-$(basename "${DEPLOY_APP_DIR}")}"
          worktree_dir="$(mktemp -d /tmp/8feet-backend-deploy.XXXXXX)"
          rmdir "${worktree_dir}"
          target_ref="${DEPLOY_REF}"
          env_file_args=()

          cleanup() {
            cd /
            git -C "${DEPLOY_APP_DIR}" worktree remove --force "${worktree_dir}" 2>/dev/null || rm -rf "${worktree_dir}"
          }
          trap cleanup EXIT

          echo "[deploy] source directory: ${DEPLOY_APP_DIR}"
          cd "${DEPLOY_APP_DIR}"
          if [ -n "$(git status --short)" ]; then
            echo "[deploy] existing local changes in deploy checkout:"
            git status --short
          fi

          echo "[deploy] fetching source"
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/remotes/origin/${DEPLOY_REF}"; then
            target_ref="origin/${DEPLOY_REF}"
          elif git rev-parse --verify --quiet "${DEPLOY_REF}^{commit}" >/dev/null; then
            target_ref="${DEPLOY_REF}"
          else
            echo "[deploy] ref not found: ${DEPLOY_REF}" >&2
            exit 1
          fi

          echo "[deploy] preparing clean worktree for ${target_ref}"
          git worktree add --force --detach "${worktree_dir}" "${target_ref}"

          if [ -f "${DEPLOY_APP_DIR}/.env" ]; then
            env_file_args=(--env-file "${DEPLOY_APP_DIR}/.env")
          fi

          cd "${worktree_dir}"

          echo "[deploy] building backend image"
          DOCKER_BUILDKIT=1 docker compose -p "${compose_project}" "${env_file_args[@]}" build --progress=plain backend

          echo "[deploy] starting services"
          docker compose -p "${compose_project}" "${env_file_args[@]}" up -d --remove-orphans
          docker compose -p "${compose_project}" "${env_file_args[@]}" ps

          echo "[deploy] waiting for readyz"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz; then
              echo
              echo "[deploy] readyz ok"
              exit 0
            fi
            sleep 5
          done

          echo "[deploy] backend did not become ready; recent logs:"
          docker compose -p "${compose_project}" "${env_file_args[@]}" logs --tail=200 backend celery-worker
          exit 1
          REMOTE_DEPLOY
