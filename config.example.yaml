Debug: false

# Django
DjangoSecretKey: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET"
AllowedHosts: ["django.example.com", "127.0.0.1", "localhost"]
CsrfTrustedOrigins: ["https://django.example.com"]
SessionCookieSecure: true
SessionCookieHttpOnly: true
SessionCookieSameSite: "Lax"
CsrfCookieSecure: true
CsrfCookieDomain: ".example.com"
CsrfCookieHttpOnly: false
CsrfCookieSameSite: "Lax"
CsrfUseSessions: false

# CORS (生产建议关闭全开放)
CorsAllowAllOrigins: false
CorsAllowedOrigins: ["https://app.example.com"]

# Security headers
SecureSSLRedirect: true
SecureHstsSeconds: 31536000
SecureHstsIncludeSubdomains: true
SecureHstsPreload: true
SecureContentTypeNosniff: true
SecureReferrerPolicy: "strict-origin-when-cross-origin"
XFrameOptions: "DENY"

# PostgreSQL
DatabaseHost: localhost
DatabasePort: 5432
DatabaseUser: admin
DatabasePassword: "CHANGE_ME_DB_PASSWORD"
DatabaseName: eightfeet

# Redis
RedisAddress: "localhost:6379"
RedisPassword: ""
RedisDatabase: 0

# Channels (未配置时回落到 RedisAddress)
ChannelRedisAddress: "localhost:6379"
ChannelRedisPassword: ""
ChannelRedisDatabase: 0

# Celery (未配置时回落到 RedisAddress)
CeleryBrokerUrl: ""
CeleryResultBackend: ""
CeleryTaskTimeLimit: 600

# Minio (S3-compatible Object Storage)
S3SecretId: "CHANGE_ME_MINIO_USER"
S3SecretKey: "CHANGE_ME_MINIO_PASSWORD"
S3Address: "localhost:9000"
S3BucketReports: eightfeet-reports
S3UseSSL: false

# Mail (optional)
# 常见配置:
# 1. SMTPS 直连: SmtpPort=465, SmtpUseSsl=true, SmtpUseTls=false
# 2. STARTTLS: SmtpPort=587, SmtpUseSsl=false, SmtpUseTls=true
# 3. 大多数服务商要求 SmtpPassword 使用 SMTP 授权码，而不是邮箱登录密码
# 4. SmtpFrom 建议与 SmtpUsername 保持一致，避免被服务商拒收
SmtpHost: "smtp.qq.com"
SmtpPort: 465
SmtpUsername: ""
SmtpPassword: ""
SmtpFrom: ""
SmtpUseSsl: true
SmtpUseTls: false
SmtpTimeout: 15
SmtpUseLocaltime: true

# Static files
StaticRoot: "/var/www/8feet/staticfiles"

# Logging
LogDir: "/var/log/8feet"
LogLevel: "INFO"
